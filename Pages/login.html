<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · TaskFlow</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <!-- Top bar navigation -->
  <header class="auth-nav">
    <a href="../index.html" class="brand" id="auth-nav-brand">
      <span class="brand-logo">
        <svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <span>Task<span class="text-gradient">Flow</span></span>
    </a>
    <div class="flex items-center gap-3">
      <button class="btn-icon" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a href="../index.html" class="btn btn-ghost btn-sm">← Back home</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="auth-logo-badge" title="Go to homepage">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </a>
        <h1>Welcome back</h1>
        <p>Log in to access your tasks, priorities, and deadlines</p>
      </div>

      <!-- Quick Demo Account Fillers -->
      <div class="quick-demo-pill" id="fill-admin-btn" title="Click to fill administrator credentials">
        <span>🔑 Admin Demo: <code>admin@taskflow.com</code></span>
        <span class="badge badge-high">Click to Fill</span>
      </div>

      <!-- Error box -->
      <div id="login-error" class="auth-alert auth-alert-error hidden" role="alert"></div>

      <!-- Login Form -->
      <form id="login-form" class="form" novalidate>
        <div class="form-group">
          <label class="label" for="login-email">Email Address <span class="required">*</span></label>
          <div class="input-wrapper">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input 
              type="email" 
              id="login-email" 
              name="email" 
              class="input" 
              placeholder="name@example.com" 
              autocomplete="email" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center">
            <label class="label" for="login-password">Password <span class="required">*</span></label>
          </div>
          <div class="input-wrapper password-wrapper">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="input" 
              placeholder="••••••••" 
              autocomplete="current-password" 
              required
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="login-password" 
              aria-label="Toggle password visibility"
            >
              <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between mt-1">
          <label class="checkbox">
            <input type="checkbox" id="remember-me" name="remember">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-3" id="login-btn">
          <span>Log In</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <div class="auth-divider">or</div>

      <!-- Guest Continue -->
      <a href="tasks.html" class="btn btn-secondary btn-block" id="continue-guest-btn">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>Continue as guest</span>
      </a>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html" id="link-to-register">Sign up free</a></p>
      </div>
    </div>
  </main>

  <script src="../js/layout.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
